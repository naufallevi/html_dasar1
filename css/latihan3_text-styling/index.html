<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text</title>
    <style>
      h1 {
        font-size: 80px;
        color: #ff0066;
        text-align: center;
        text-transform: uppercase;
        /* none, lowercase, uppercase, capitalize */
        word-spacing: 50px;
      }
      p {
        text-align: justify;
        /* left, right, center, justify */
        text-indent: 5%;
        letter-spacing: 5px;
      }

      a {
        text-decoration: none;
        /* none, underline, overline. line-through */
      }
    </style>
  </head>
  <body>
    <h1>Lorem Ipsum</h1>

    <p>
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Doloremque
      aliquam dolorem at, inventore error reprehenderit id voluptatum quas
      voluptates enim deserunt aperiam! Sapiente ipsum consectetur laudantium
      labore perferendis perspiciatis eos!
    </p>

    <a href="#">Menu A</a>
  </body>
</html>
