<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inheritance CSS</title>
    <style>
      body {
        font-style: italic;
        color: red;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum</h1>

    <a href="#">Lorem ipsum</a>

    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Ratione ab
      voluptatibus facere neque, soluta consequuntur. Architecto eveniet
      sapiente temporibus facere nostrum natus voluptatem atque, perferendis
      ullam tempora cum nobis magni.
    </p>
  </body>
</html>
