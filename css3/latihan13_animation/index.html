<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation CSS</title>
    <style>
      .kotak {
        width: 200px;
        height: 200px;
        background-color: yellowgreen;
        animation: animasiKotak 3s 1 alternate forwards;
        /* animation:
        [name] [duration] [timing-function]
        [delay] [iteration-count] [direction]
        [fill-mode] [play-state] */
        /* iteration-count = angka | infinite */
        /* direction = normal | reverse | alternate | alternate-reverse */
        /* fill-mode = none | forwards | backwards | both */
      }

      @keyframes animasiKotak {
        /* from {
          width: 200px;
        }

        to {
          width: 500px;
        } */

        0% {
          width: 200px;
        }

        50% {
          width: 500px;
          height: 200px;
        }

        100% {
          width: 500px;
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="kotak"></div>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Odio, placeat
      reprehenderit deleniti illo at ducimus sapiente voluptates a quidem vitae?
      Impedit hic perferendis earum dolores officiis culpa tempora error
      laboriosam?
    </p>
  </body>
</html>
