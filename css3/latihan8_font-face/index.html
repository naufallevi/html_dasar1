<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Face</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Silkscreen";
        src: url("slkscr.ttf") format("truetype");
        src: url("slkscrb.ttf") format("truetype");
        src: url("slkscre.ttf") format("truetype");
        src: url("slkscreb.ttf") format("truetype");
      }

      @font-face {
        font-family: "silkscreennormal";
        src: url("slkscr-webfont.woff2") format("woff2");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "open_sansregular";
        src: url("OpenSans-Regular-webfont.woff") format("woff");
        font-weight: normal;
        font-style: normal;
      }

      h1 {
        font-size: 100px;
        text-align: center;
        font-family: "Poppins", sans-serif;
        font-weight: 800;
      }

      h2 {
        text-align: center;
        font-family: "silkscreennormal";
      }

      h3 {
        text-align: center;
        font-family: "Silkscreen";
      }

      p {
        font-family: "open_sansregular";
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum</h1>
    <h2>dolor sit, amet</h2>
    <h3>consectetur adipisicing elit.</h3>
    <p>
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Placeat natus,
      blanditiis accusamus voluptas temporibus molestias dignissimos. Saepe
      nemo, dolor libero explicabo consequatur harum nam vitae temporibus at
      quod minus quae.
    </p>
  </body>
</html>
