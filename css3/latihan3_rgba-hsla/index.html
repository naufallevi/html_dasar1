<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RGB dan HSLA CSS</title>
    <style>
      body {
        background-image: url(bg.png);
      }

      .satu {
        width: 300px;
        height: 300px;
        background-color: rgb(192, 255, 0, 0.5);
        /* background-color: hsl(79, 100%, 50%, 0.5); */
        position: relative;
      }

      .dua {
        width: 100px;
        height: 100px;
        background-color: blue;
        position: absolute;
        top: 250px;
        left: 250px;
      }
    </style>
  </head>
  <body>
    <div class="satu">
      <div class="dua"></div>
    </div>
  </body>
</html>
