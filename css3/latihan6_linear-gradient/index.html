<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linear Gradient CSS</title>
    <style>
      div {
        width: 400px;
        height: 250px;
        margin: 50px auto;
        /* background: linear-gradient(Sudut/Arah, warna Pertama (color stop%), warna Kedua (color stop%), ..., Warna n (color stop%)); */
        /* Arah: ndeg / to top, to bottom, to left, to right / to left top, to left bottom, to right top, to right bottom */
        background: linear-gradient(
          to right,
          #84994f 63%,
          #ffe797,
          #fcb53b 90%
        );
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
