<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Shadow CSS</title>
    <style>
      .satu {
        width: 200px;
        height: 200px;
        background-color: salmon;
        margin: 50px auto;
        /* box-shadow: x-offset y-offset blur color; */
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);
      }

      .dua {
        width: 200px;
        height: 200px;
        background-color: greenyellow;
        margin: 50px auto;
        /* box-shadow: x-offset y-offset blur spread color; */
        box-shadow: 0px 20px 10px -5px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
      }

      .dua:hover {
        box-shadow: 0px 50px 10px -15px rgba(0, 0, 0, 0.2);
        margin-top: 40px;
      }

      .tiga {
        width: 200px;
        height: 200px;
        background-color: skyblue;
        margin: 50px auto;
        /* inset box-shadow: x-offset y-offset blur spread color; */
        box-shadow: inset 0 0 10px 10px rgba(0, 0, 0, 0.5);
      }

      /* Mulltiple Shadow */
      .empat {
        width: 200px;
        height: 200px;
        background-color: #476eae;
        margin: 50px auto;
        transition: 1s;
      }

      .empat:hover {
        box-shadow: 0 0 0 10px #48b3af, 0 0 0 20px #a7e399, 0 0 0 30px #f6ff99;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="satu"></div>
    <hr />
    <div class="dua"></div>
    <hr />
    <div class="tiga"></div>
    <hr />
    <div class="empat"></div>
  </body>
</html>
