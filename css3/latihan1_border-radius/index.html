<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Radius CSS</title>
    <style>
      .satu {
        width: 300px;
        height: 300px;
        background-color: sandybrown;
        border-radius: 50%;
        line-height: 300px;
        text-align: center;
      }

      .dua {
        width: 300px;
        height: 300px;
        background-color: yellowgreen;
        background-image: url(profil.jpg);
        background-size: cover;
        background-repeat: no repeat;
        /* border-top-left-radius: 0;
        border-top-right-radius: 0;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0; */
        border-radius: 0 50% 50% 50%;
        line-height: 300px;
        text-align: center;
      }

      .tiga {
        width: 300px;
        height: 300px;
        background-color: orange;
        border-radius: 0 50% 50% 0;
        line-height: 300px;
        text-align: center;
        overflow: hidden;
      }

      .tiga img {
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div class="satu">Lorem</div>
    <br />
    <div class="dua">Lorem</div>
    <br />
    <div class="tiga">
      <img src="profil.jpg" alt="profil" />
    </div>
  </body>
</html>
