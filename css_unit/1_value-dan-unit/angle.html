<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angle Unit</title>
    <style>
      .kotak {
        width: 100px;
        height: 100px;
        background-color: crimson;
        margin: 100px;

        /* derajat */
        transform: rotate(30deg);
        /* turn */
        transform: rotate(0.0833turn);
        /* radian */
        transform: rotate(0.5236rad);
        /* grad */
        transform: rotate(33.33grad);
      }
    </style>
  </head>
  <body>
    <div class="kotak"></div>
  </body>
</html>
