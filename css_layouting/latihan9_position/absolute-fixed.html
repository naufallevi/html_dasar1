<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position CSS - Absolute dan Fixed</title>
    <style>
      body {
        height: 2000px;
      }

      div {
        width: 100px;
        height: 100px;
        margin: auto;
      }

      .satu {
        background-color: red;
      }

      .dua {
        background-color: green;
        position: absolute;
        top: 0;
        right: 0;
      }

      .tiga {
        background-color: blue;
        position: fixed;
        width: 100%;
        height: 25px;
        top: 0;
        left: 0;
        font-weight: bold;
        line-height: 25px;
        text-align: center;
      }

      .empat {
        background-color: brown;
      }

      .container {
        width: 600px;
        height: 400px;
        border: 10px solid yellow;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="satu"></div>
      <div class="dua"></div>
      <div class="tiga">Fixed Position</div>
      <div class="empat"></div>
    </div>
  </body>
</html>
