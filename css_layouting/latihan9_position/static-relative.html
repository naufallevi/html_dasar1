<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position CSS - Static dan Relative</title>
    <style>
      div {
        width: 100px;
        height: 100px;
      }

      .satu {
        background-color: red;
      }

      .dua {
        background-color: green;
        position: relative;
        top: 20px;
        left: 50px;
      }

      .tiga {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="satu"></div>
    <div class="dua"></div>
    <div class="tiga"></div>
  </body>
</html>
