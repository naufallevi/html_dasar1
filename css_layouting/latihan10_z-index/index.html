<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z Index CSS</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        position: absolute;
      }

      .satu {
        background-color: red;
        z-index: 9999;
      }

      .dua {
        background-color: green;
        top: 100px;
        left: 100px;
        z-index: 2;
      }

      .tiga {
        background-color: blue;
        top: 200px;
        left: 200px;
        z-index: -9999;
      }
    </style>
  </head>
  <body>
    <div class="tiga"></div>
    <div class="dua"></div>
    <div class="satu"></div>
  </body>
</html>
