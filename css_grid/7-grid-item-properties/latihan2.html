<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid | Grid Item Properties</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        background-color: #ddd;
      }

      .container {
        width: 80%;
        margin: 50px auto;
        display: grid;
        /* grid-template-columns: minmax(200px, 300px) 1fr 1fr;
        grid-template-rows: repeat(3, 100px); */

        grid-template-columns: [k1] minmax(200px, 300px) [k2] 1fr [k3] 1fr [k4];
        grid-template-rows: [b1] 100px [b2] 100px [b3] 100px [b4];
      }

      .item {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .my-item {
        /* grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 2;
        grid-row-end: 4; */

        /* grid-column: 2 / 4;
         grid-row: 2 / 4; */

        /* grid-column-start: 1;
        grid-column-end: span 3;
        grid-row-start: 1;
        grid-row-end: span 2; */

        grid-column: 1 / span 3;
        grid-row: 1 / span 2;

        /* grid-column-start: k1;
        grid-column-end: k4;
        grid-row-start: b1;
        grid-row-end: b4; */

        /* grid-column: k1 / k4;
        grid-row: b1 / b4; */

        /* grid-column-start: -1;
        grid-column-end: -2;
        grid-row-start: -4;
        grid-row-end: -1; */

        /* grid-colum: -1 / -2;
        grid-row: -4 / -1; */

        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item my-item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
      <!-- <div class="item">7</div>
      <div class="item">8</div>
      <div class="item">9</div> -->
    </div>
  </body>
</html>
