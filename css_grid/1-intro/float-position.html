<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Position</title>
    <style>
      .container {
        position: relative;
      }
      .header {
        background-color: crimson;
        width: 100%;
        height: 200px;

        text-align: center;
        line-height: 200px;
        text-transform: uppercase;
        font-weight: bold;
      }

      .aside {
        background-color: lightblue;
        width: 30%;
        height: 200px;

        text-align: center;
        line-height: 200px;
        text-transform: uppercase;
        font-weight: bold;
        float: left;
      }

      .main {
        background-color: lawngreen;
        width: 70%;
        height: 400px;

        text-align: center;
        line-height: 400px;
        text-transform: uppercase;
        font-weight: bold;
        float: left;
      }

      .nav {
        background-color: orange;
        width: 30%;
        height: 200px;

        text-align: center;
        line-height: 200px;
        text-transform: uppercase;
        font-weight: bold;
        float: left;
        position: absolute;
        top: 400px;
      }

      .footer {
        background-color: pink;
        width: 100%;
        height: 100px;

        text-align: center;
        line-height: 100px;
        text-transform: uppercase;
        font-weight: bold;
        float: left;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Header</div>
      <div class="aside">Aside</div>
      <div class="main">Main</div>
      <div class="nav">Nav</div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
